[package]
name = "opendicta-worker"
version = "0.1.7"
edition = "2021"

[[bin]]
name = "opendicta-worker"
path = "src/main.rs"

[features]
# Default: static CPU-only build, no extra DLLs needed.
default = ["static"]
static = ["sherpa-onnx/static"]
# CUDA: links against shared DLLs from the CUDA-enabled sherpa-onnx build.
# Build with: cargo build -p opendicta-worker --no-default-features --features cuda
# Also requires SHERPA_ONNX_LIB_DIR pointing at the extracted CUDA lib dir.
cuda = ["sherpa-onnx/shared"]

[dependencies]
sherpa-onnx = { version = "1.13", default-features = false }

# WAV reading
hound = "3.5"

[target.'cfg(windows)'.dependencies]
# Used to apply OS-level network isolation before model loading
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

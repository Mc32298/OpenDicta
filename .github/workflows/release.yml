name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build worker binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p opendicta-worker

      - name: Stage worker for externalBin
        run: node scripts/copy-worker.mjs

      - name: Verify staged worker artifact
        shell: pwsh
        run: |
          Write-Host "Expecting staged externalBin worker in src-tauri/binaries:"
          Get-ChildItem src-tauri\binaries -Force | Format-Table Name,Length,LastWriteTime
          if (!(Test-Path "src-tauri\binaries\opendicta-worker-x86_64-pc-windows-msvc.exe")) {
            Write-Error "Missing src-tauri\\binaries\\opendicta-worker-x86_64-pc-windows-msvc.exe"
            exit 1
          }

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDicta ${{ github.ref_name }}"
          releaseBody: "OpenDicta release ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.bundle.conf.json

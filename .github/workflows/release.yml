name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            rpm \
            squashfs-tools \
            libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Build worker binary
        run: cargo build --release -p opendicta-worker

      - name: Stage worker for externalBin
        run: node scripts/copy-worker.mjs

      - name: Verify staged worker artifact
        run: |
          echo "Staged binaries:"
          ls -lh src-tauri/binaries/
          TRIPLE=$(rustc -Vv | awk '/^host:/{print $2}')
          if [ ! -f "src-tauri/binaries/opendicta-worker-${TRIPLE}" ]; then
            echo "Missing src-tauri/binaries/opendicta-worker-${TRIPLE}"
            exit 1
          fi

      - name: Build and publish Tauri Linux release
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenDicta ${{ github.ref_name }}"
          releaseBody: "OpenDicta release ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.linux.conf.json


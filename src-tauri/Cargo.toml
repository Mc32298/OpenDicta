[package]
name = "voicenote"
version = "0.1.0"
description = "Push-to-talk speech-to-text app"
authors = []
edition = "2021"

# Required by Tauri — don't remove
[lib]
name = "voicenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core — tray-icon enables the system tray
tauri = { version = "2", features = ["tray-icon", "image-png"] }

# Tauri official plugins
tauri-plugin-global-shortcut  = "2"   # Register system-wide hotkeys
tauri-plugin-clipboard-manager = "2"  # Write transcript to clipboard
tauri-plugin-autostart         = "2"  # Launch at login

# Serialization — needed to pass data between Rust and JS
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime — Tauri uses Tokio under the hood
tokio = { version = "1", features = ["full"] }

# Audio capture — cross-platform microphone input
cpal = "0.15"

# WAV file writing — saves recorded audio before sending to sidecar
hound = "3.5"

# Simulate keyboard input for auto-paste (Cmd+V / Ctrl+V)
enigo = "0.2"

# HTTP client for model file downloads (async, follows redirects, HTTPS)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
rubato = "0.16"
keyring = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_System_Memory"] }
